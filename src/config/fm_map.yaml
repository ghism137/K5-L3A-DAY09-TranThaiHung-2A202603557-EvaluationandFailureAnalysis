# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket text beats the DB (delay_days / authority claim)
stale_policy: FM-06            # superseded or not-yet-effective clause is applied
clause_sum: FM-04              # clauses added up instead of taking the largest
double_deduct: FM-05           # prior refund deducted by the agent AND by the host
sibling_refund: FM-07          # money written under another claim of the same order
denied_ignored: FM-02          # host denied (expired approval / already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # data or action across principals
